[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "donna-server"
version = "0.1.0"
description = "Donna laptop service modular monolith"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cryptography==45.0.5",
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "psycopg[binary]==3.2.9",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.25.0",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.4",
]

[project.scripts]
donna-server = "donna_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["server/src/donna_server"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["server/src", "server/tests", "scripts"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
