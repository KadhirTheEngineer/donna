[package]
name = "donna"
version = "0.1.0"
edition = "2024"
authors = ["kadhirtheengineer"]
description = "A local-first terminal dashboard for your personal secretary"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
crossterm = "0.29.0"
directories = "6.0.0"
ed25519-dalek = "2.2.0"
keyring = "3.6.3"
rand = "0.9.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
tempfile = "3.23.0"
toml = "0.9.8"
tungstenite = { version = "0.27.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2.5.4"

[profile.release]
lto = "thin"
strip = true

