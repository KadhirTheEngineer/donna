[package]
name = "donna"
version = "0.1.0"
edition = "2024"
authors = ["kadhirtheengineer"]
description = "A local-first terminal dashboard for your personal secretary"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = true

